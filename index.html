<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Libre</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header class="cabecera">
    <svg class="franja" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <polygon points="56,0 64,0 50,100 42,100"></polygon>
    </svg>
    <div class="cabecera-fila">
      <h1 class="marca"><span class="luz"></span>Libre</h1>
      <div class="dinero" id="dinero">0,00 €</div>
    </div>
    <div class="cabecera-fila">
      <div class="reloj" id="reloj">Lunes 07:00</div>
    </div>
    <div class="barra-dia"><div id="barra-dia"></div></div>
  </header>

  <main id="juego">
    <p class="ayuda">Cargando…</p>
  </main>

  <!-- Menú inferior: cada pestaña enseña una parte del juego. -->
  <nav class="menu-inferior" aria-label="Secciones del juego">
    <button type="button" data-vista="calle" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 15l2-5.5A2 2 0 0 1 6.9 8h10.2a2 2 0 0 1 1.9 1.5L21 15v3h-2.5M5.5 18H3v-3h18M9 6h6"/><circle cx="7.5" cy="18" r="1.8"/><circle cx="16.5" cy="18" r="1.8"/></svg>
      <span>Calle</span><i class="marca-aviso" data-aviso="calle"></i>
    </button>
    <button type="button" data-vista="flota">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="8" r="4"/><path d="M11 11l9 9M16 16l2-2M18.5 18.5l1.5-1.5"/></svg>
      <span>Flota</span><i class="marca-aviso" data-aviso="flota"></i>
    </button>
    <button type="button" data-vista="mejoras">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V5M6 11l6-6 6 6M5 20h14"/></svg>
      <span>Mejoras</span><i class="marca-aviso" data-aviso="mejoras"></i>
    </button>
    <button type="button" data-vista="partida">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>
      <span>Partida</span>
    </button>
  </nav>

  <div class="mensaje oculto" id="mensaje" role="status"></div>

  <!-- Orden importante: configuración, lógica, guardado, ambiente, retratos, interfaz y arranque. -->
  <script src="js/config.js"></script>
  <script src="js/simulacion.js"></script>
  <script src="js/guardado.js"></script>
  <script src="js/ambiente.js"></script>
  <script src="js/retratos.js"></script>
  <script src="js/interfaz.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
